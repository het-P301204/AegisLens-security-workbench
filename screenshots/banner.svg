<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" role="img" aria-label="AegisLens - Security Evidence and Risk Intelligence Workbench">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#151a23"/>
    </linearGradient>
  </defs>

  <rect width="760" height="170" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="759" height="169" rx="11.5" fill="none" stroke="#232936"/>

  <!-- shield mark -->
  <g transform="translate(44, 45)">
    <path d="M40 2 74 15.5v27.8C74 64 60 79.2 40 86 20 79.2 6 64 6 43.3V15.5L40 2Z"
          fill="#12151b" stroke="#4f8ff0" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="40" cy="39" r="13" fill="none" stroke="#7fb2f5" stroke-width="2.4"/>
    <path d="m49.6 48.6 9.4 9.4" stroke="#7fb2f5" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="160" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40"
        font-weight="600" letter-spacing="-0.8" fill="#e7eaf0">AegisLens</text>
  <text x="161" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5"
        fill="#8d95a6">Security Evidence &amp; Risk Intelligence Workbench</text>

  <!-- risk formula chip -->
  <rect x="161" y="112" width="214" height="26" rx="6" fill="#171b22" stroke="#232936"/>
  <text x="173" y="129" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#7fb2f5">
    risk = likelihood × impact
  </text>

  <!-- severity legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="0.6">
    <rect x="391" y="112" width="66" height="26" rx="6" fill="#f0616d" fill-opacity="0.12" stroke="#f0616d" stroke-opacity="0.4"/>
    <text x="405" y="129" fill="#f0616d">CRITICAL</text>

    <rect x="465" y="112" width="46" height="26" rx="6" fill="#f0913f" fill-opacity="0.12" stroke="#f0913f" stroke-opacity="0.4"/>
    <text x="478" y="129" fill="#f0913f">HIGH</text>

    <rect x="519" y="112" width="62" height="26" rx="6" fill="#dcb544" fill-opacity="0.12" stroke="#dcb544" stroke-opacity="0.4"/>
    <text x="532" y="129" fill="#dcb544">MEDIUM</text>

    <rect x="589" y="112" width="42" height="26" rx="6" fill="#4fa3d1" fill-opacity="0.12" stroke="#4fa3d1" stroke-opacity="0.4"/>
    <text x="603" y="129" fill="#4fa3d1">LOW</text>

    <rect x="639" y="112" width="76" height="26" rx="6" fill="#171b22" stroke="#2f3644"/>
    <text x="649" y="129" fill="#8d95a6">INFO ONLY</text>
  </g>
</svg>
