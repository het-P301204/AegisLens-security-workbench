name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Verify the sample dataset seeds cleanly
        run: python -m app.seed --force
        env:
          AEGISLENS_DATABASE_URL: sqlite:///./ci-check.db

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  sample-data:
    name: Sample data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON and cross-references
        run: python scripts/validate_sample_data.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aegislens:ci .

      - name: Start container and check health
        run: |
          docker run -d --name aegislens-ci -p 8000:8000 aegislens:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "\nHealth check passed"
              exit 0
            fi
            sleep 3
          done
          echo "Health check never succeeded"
          docker logs aegislens-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f aegislens-ci || true
